#
# The cheap rot checks for this repository: nothing here trains a net or needs a GPU, a dataset or a
# toolchain beyond what the image ships. The expensive checks that matter - does a net this pipeline
# produced load and play - are the engines' own, because "does this net work here" is the one question
# only the engine can answer (see README.md, "What belongs here, and what does not").
#
# EVERY JOB RUNS ON A GITHUB-HOSTED IMAGE, PINNED BY VERSION, AND THAT IS DELIBERATE. The
# organisation's self-hosted runner group does not admit public repositories at all, so a
# `self-hosted` label here would queue forever and never start. The two Linux self-hosted machines
# are also the machines that run the engines' timed chess matches, so a job landing beside a match
# takes its cores and biases its time control - which is the second reason not to point this at them.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck version
        run: shellcheck --version
      # bash -n catches a syntax error; shellcheck catches the quoting and word-splitting faults that
      # run fine until a path has a space in it. The pipeline scripts are what a training run invokes,
      # so a fault in them costs a run rather than a compile.
      - name: bash -n
        run: |
          for script in pipeline/*.sh bullet/*.sh .githooks/pre-commit .githooks/pre-push; do
            bash -n "$script" && echo "ok   $script"
          done
      - name: shellcheck
        run: shellcheck -S warning pipeline/*.sh bullet/*.sh .githooks/pre-commit .githooks/pre-push

  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: python version
        run: python3 --version
      - name: compile every module
        run: python3 -m compileall -q pytorch spec
      # compileall parses, it does not import, so it cannot see a module that resolves nothing at run
      # time. `pytorch/` reaches the container module through `pytorch/spec_path.py`, and this is the
      # check that the path it arranges is still right: it needs no trainer environment, because
      # spec/rnnue1.py is stdlib-only.
      - name: pytorch/ can import the container module
        working-directory: pytorch
        run: python3 -c "import spec_path, rnnue1; print('ok  rnnue1 via spec_path:', rnnue1.MAGIC)"
      # numpy is the only dependency of the featuriser and the bulletformat reader, so importing those
      # for real is cheap. train.py and verify.py additionally need torch, which is not worth a CI
      # download here - they reach rnnue1 by the same one line the step above exercises.
      - name: the numpy-only modules import
        run: |
          python3 -m pip install --quiet numpy
          cd pytorch
          python3 -c "
          import features, bulletformat, bulletformat_check
          print('ok  features/bulletformat/bulletformat_check import, INPUT_FEATURES', features.INPUT_FEATURES)
          "
      # spec/rnnue1.py is stdlib-only on purpose, so the container can be checked with no trainer
      # environment at all. This exercises the CRC against its published check value and round-trips a
      # net through write_net/read_payload - the two things an engine's loader depends on being right.
      - name: the RNNUE1 container round-trips
        run: |
          python3 -I - <<'PY'
          import sys
          sys.path.insert(0, "spec")
          import rnnue1

          assert rnnue1.crc64_xz(b"123456789") == rnnue1.CRC64_CHECK_VALUE, "CRC-64/XZ check value"
          assert len(rnnue1.KING_BUCKET_MAP) == 64, "the king-bucket map has one entry per square"
          assert max(rnnue1.KING_BUCKET_MAP) == rnnue1.NUM_KING_BUCKETS - 1, "map overruns the buckets"
          assert rnnue1.INPUT_FEATURES == rnnue1.NUM_KING_BUCKETS * rnnue1.BASE_FEATURES

          payload = bytes(rnnue1.PAYLOAD_BYTES)
          built = rnnue1.header(payload)
          assert len(built) == rnnue1.HEADER_BYTES, "the header is not 64 bytes"
          assert built[:8] == rnnue1.MAGIC, "wrong magic"

          rnnue1.write_net("roundtrip.bin", payload)
          assert rnnue1.read_payload("roundtrip.bin") == payload, "write_net/read_payload disagree"
          print("ok  RNNUE1 container: CRC check value, map, header, round trip")
          PY
      # The stamper is what every net in the organisation is created by, so its three accepted inputs
      # and its refusals are checked here rather than discovered on a net. The bullet-padded input must
      # stamp byte-identically to the bare payload: that equality is the whole point of dropping the
      # padding, and it is what lets a loader tell a truncated file from a sound one.
      - name: the stamper accepts its three inputs and refuses the rest
        run: |
          python3 -I - <<'PY'
          import os
          import subprocess
          import sys

          sys.path.insert(0, "spec")
          import rnnue1

          payload = bytes((i * 7 + 3) % 251 for i in range(rnnue1.PAYLOAD_BYTES))
          open("bare.bin", "wb").write(payload)
          open("padded.bin", "wb").write(payload + (b"bullet" * 40)[:40])
          open("appended.bin", "wb").write(payload + b"junkjunkju")
          open("short.bin", "wb").write(payload[:100])

          def stamp(*arguments):
              return subprocess.run([sys.executable, "spec/stamp_net.py", *arguments],
                                    capture_output=True, text=True)

          assert stamp("bare.bin", "a.nnue").returncode == 0, "a bare payload must stamp"
          assert rnnue1.read_payload("a.nnue") == payload, "the stamped net must read back"
          assert stamp("padded.bin", "b.nnue").returncode == 0, "bullet's padded output must stamp"
          assert open("b.nnue", "rb").read() == open("a.nnue", "rb").read(),               "padded and bare input must give the same net"
          assert stamp("a.nnue").returncode == 0, "a stamped net must re-stamp in place"

          for name in ("appended.bin", "short.bin"):
              assert stamp(name, "no.nnue").returncode != 0, f"{name} must be refused"

          image = bytearray(open("a.nnue", "rb").read())
          image[-1] ^= 0xFF
          open("corrupt.nnue", "wb").write(bytes(image))
          assert stamp("corrupt.nnue", "no.nnue").returncode != 0,               "a corrupt net must not be quietly re-blessed"
          print("ok  stamper: 3 inputs accepted, 3 refusals, padded == bare byte for byte")
          PY

  licence-headers:
    name: licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Every source file carries an SPDX identifier. pipeline/new-shape-signature.sh is the one
      # deliberate exception: its value is being byte-identical to the copies in pawnstar, pawnstar-rs
      # and pawnstar-go, and a fourth variant differing by two header lines is exactly the drift that
      # file exists to detect.
      - name: every source file carries an SPDX identifier
        run: |
          status=0
          for file in $(git ls-files '*.py' '*.rs' '*.c' '*.cpp' '*.sh' .githooks/pre-commit .githooks/pre-push); do
            if [ "$file" = "pipeline/new-shape-signature.sh" ]; then
              continue
            fi
            if grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' "$file"; then
              echo "ok      $file"
            else
              echo "MISSING $file"
              status=1
            fi
          done
          exit $status
